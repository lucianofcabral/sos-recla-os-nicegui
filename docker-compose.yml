services:
  db:
    image: postgres:16-alpine
    container_name: sos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sos
      POSTGRES_PASSWORD: sos
      POSTGRES_DB: sos_reclamos
    ports:
      - '5432:5432'
    volumes:
      - sos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sos -d sos_reclamos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sos_pgdata: